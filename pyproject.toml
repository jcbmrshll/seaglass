[project]
name = "seaglass"
version = "0.1.0"
description = "Experiment monitoring for research code, with renderers that travel with the runs"
authors = [{ name = "Jacob Marshall", email = "92640744+jcbmrshll@users.noreply.github.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
# the client writes arrays as .npz; the server needs nothing beyond the stdlib
dependencies = ["numpy>=1.26"]

[project.scripts]
seaglass = "seaglass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seaglass"]

[tool.pyright]
include = ["seaglass", "tests", "examples"]
venvPath = "."
venv = ".venv"

[tool.ruff]
# `ruff check` uses ruff's default rule set (no select/ignore); `ruff format` uses its defaults (line length 88)

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
